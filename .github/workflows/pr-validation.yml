name: PR Validation

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read
  issues: write

jobs:
  validate-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Check if release branch
        id: check_release
        env:
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ "$SOURCE_BRANCH" =~ ^release/ ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "Release branch detected: $SOURCE_BRANCH"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "Non-release branch: $SOURCE_BRANCH"
          fi

      - name: Check for Issue Reference
        id: check_issue
        if: steps.check_release.outputs.is_release == 'false'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Accepts a ticket reference (TR-123) or the word "Release"
          # (for release PRs merging into main) anywhere in the PR title.
          if [[ "$PR_TITLE" =~ TR-[0-9]+ ]] || [[ "$PR_TITLE" =~ [Rr]elease ]]; then
            echo "issue_found=true" >> "$GITHUB_OUTPUT"
          else
            echo "issue_found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check PR Description Completeness
        id: check_description
        if: steps.check_release.outputs.is_release == 'false'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if grep -qF "Issue being resolved" <<< "$PR_BODY"; then
            echo "has_issue=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_issue=false" >> "$GITHUB_OUTPUT"
          fi

          if grep -qF "Solution description" <<< "$PR_BODY"; then
            echo "has_solution=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_solution=false" >> "$GITHUB_OUTPUT"
          fi

          if grep -qF "Steps to test" <<< "$PR_BODY"; then
            echo "has_test_steps=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_test_steps=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment on PR if issue reference missing
        if: steps.check_release.outputs.is_release == 'false' && steps.check_issue.outputs.issue_found == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- pr-validation:issue-reference -->';
            const body = [
              marker,
              '## ⚠️ Missing Issue Reference',
              '',
              'This PR title does not reference an issue. Please include one.',
              '',
              '**Examples:**',
              '- `TR-123: Fix login bug`',
              '- `Release 1.2.3`',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Generate PR Validation Summary
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const isRelease = '${{ steps.check_release.outputs.is_release }}' === 'true';
            const issueFound = '${{ steps.check_issue.outputs.issue_found }}' === 'true';
            const hasIssue = '${{ steps.check_description.outputs.has_issue }}' === 'true';
            const hasSolution = '${{ steps.check_description.outputs.has_solution }}' === 'true';
            const hasTestSteps = '${{ steps.check_description.outputs.has_test_steps }}' === 'true';

            const skipped = '➖ Skipped (Release Branch)';
            const status = (ok) => (isRelease ? skipped : ok ? '✅ Present' : '⚠️ Missing');

            const lines = [
              '## 📋 PR Validation Summary',
              '',
              '| Check | Status |',
              '|-------|--------|',
              `| Issue Reference | ${status(issueFound)} |`,
              `| Issue Section | ${status(hasIssue)} |`,
              `| Solution Description | ${status(hasSolution)} |`,
              `| Test Steps | ${status(hasTestSteps)} |`,
              '',
              isRelease
                ? '➖ Release branch - all validation checks skipped.'
                : issueFound && hasSolution && hasTestSteps
                ? '✅ All checks passed!'
                : '⚠️ Some optional sections are missing.',
            ];

            await core.summary.addRaw(lines.join('\n')).write();
